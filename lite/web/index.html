<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-color="blue" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamDoc</title>
  <!-- favicon 静态兜底用默认蓝色种子(#3370ff);theme.js 加载后会按当前种子色重绘。
       这里的值只影响"首帧到 theme.js 执行"之间的极短瞬间,故与默认色一致即可,
       不要写死一个与 6 个种子色都不沾边的颜色。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233370ff'/%3E%3Cpath d='M9 9h14v3H9zm0 5.5h14v3H9zm0 5.5h9v3H9z' fill='white'/%3E%3C/svg%3E">
  <script>
    // 首屏防闪烁:在样式加载前恢复主题、种子色与密度(与 js/theme.js 的存储键保持一致)
    (function () {
      var m = localStorage.getItem('td:theme-mode') || 'system';
      var c = localStorage.getItem('td:seed-color') || 'blue';
      var d = localStorage.getItem('td:density') === 'compact' ? 'compact' : 'comfortable';
      var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.color = c;
      document.documentElement.dataset.density = d;
    })();
  </script>
  <!-- Remix Icon 4.5.0(class 方式);本地 vendor,断外网可用 -->
  <link rel="stylesheet" href="/vendor/remixicon/remixicon.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/editor.css">
  <link rel="stylesheet" href="/css/drive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <!-- 登录后的 SPA 壳:40px 顶栏 + 左栏(空间导航 / 唯一文档树 / 云空间与回收站)+ 单一内容面 -->
  <div id="shell" hidden>
    <header id="topbar">
      <button class="btn-icon" id="btn-side" type="button" title="打开导航"><i class="ri-menu-line"></i></button>
      <button id="space-switch" class="space-switch" type="button" aria-haspopup="menu" title="切换空间">
        <span class="space-dot" id="space-dot"></span>
        <span class="space-name" id="space-name">选择空间</span>
        <i class="ri-arrow-down-s-line"></i>
      </button>
      <button id="cmd-open" class="cmd-trigger" type="button" title="搜索或跳转(Ctrl+K)">
        <i class="ri-search-line"></i>
        <span>搜索或跳转</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="topbar-actions">
        <button class="btn-icon" id="btn-notify" type="button" title="通知"><i class="ri-notification-3-line"></i></button>
        <a class="btn-icon" id="btn-settings" href="#/settings/account" title="设置"><i class="ri-settings-3-line"></i></a>
        <button class="btn-icon topbar-avatar" id="btn-user" type="button" title="账户"></button>
      </div>
    </header>
    <div id="shell-body">
      <aside id="sidebar">
        <nav id="side-nav" class="side-nav" aria-label="当前空间导航"></nav>
        <!-- 单一文档树:只由文档模块占用;离开文档模块即清空 -->
        <div id="side-doc-tree" class="side-doc-tree"></div>
        <nav id="side-foot" class="side-foot" aria-label="空间资源"></nav>
        <button class="side-collapse btn-icon" id="side-collapse" type="button" title="收起导航">
          <i class="ri-side-bar-line"></i>
        </button>
      </aside>
      <!-- 窄屏抽屉遮罩(仅 #shell.side-open 时显示);视觉走 .scrim 基类 -->
      <div class="side-scrim scrim" id="side-scrim"></div>
      <main id="main"><div id="view"></div></main>
    </div>
  </div>

  <!-- 登录 / 初始化向导视图(无壳),由 app.js 渲染 -->
  <div id="login-root" hidden></div>
  <div id="toast-root"></div>

  <!-- Markdown 渲染栈:全部本地 vendor(纯内网可运行);KaTeX 按需懒加载,见 js/markdown.js -->
  <script src="/vendor/marked/marked.min.js"></script>
  <script src="/vendor/prism/prism.min.js"></script>
  <script src="/vendor/prism/prism-autoloader.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/endpoints.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/diff.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/ref.js"></script>
  <!-- 编辑器:C M 6 vendor + 门面(顺序不可变;视图只使用 DocEditor) -->
  <script src="/vendor/codemirror/editor.bundle.js"></script>
  <script src="/js/editor/markdown.js"></script>
  <script src="/js/editor/keymap.js"></script>
  <script src="/js/editor/theme.js"></script>
  <script src="/js/editor/extensions.js"></script>
  <script src="/js/editor/panels.js"></script>
  <script src="/js/editor/index.js"></script>
  <!-- 渲染机制:路由文法(route.js)→ 作用域链(scopes.js)。必须在 views 之前 -->
  <script src="/js/route.js"></script>
  <script src="/js/scopes.js"></script>
  <script src="/js/views/recent.js"></script>
  <script src="/js/views/home.js"></script>
  <script src="/js/views/palette.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/project.js"></script>
  <script src="/js/views/docs.js"></script>
  <script src="/js/views/doc-tree.js"></script>
  <script src="/js/views/move-target.js"></script>
  <script src="/js/views/doc-editor.js"></script>
  <script src="/js/views/drive.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/app.js"></script>
  <!-- 管理后台脚本不在此静态加载:App.loadAdmin() 仅管理员按需按序注入 -->
</body>
</html>
